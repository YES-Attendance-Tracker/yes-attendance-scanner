<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YES Attendance Scanner</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #0b4f9c;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #6b7280;
            line-height: 1.5;
        }

        #googleButton {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .scanner-section {
            display: none;
        }

        #reader {
            width: 100%;
            max-width: 450px;
            margin: 25px auto;
        }

        .scanner-box {
            margin: 25px auto;
            padding: 15px;
            border: 2px dashed #0b4f9c;
            border-radius: 12px;
            color: #0b4f9c;
        }

        #scanMessage {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .logout-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            padding: 20px;
        }

    </style>

</head>

<body>

<header class="header">

    <h1>YES Attendance Scanner</h1>

    <p>
        Young Economists' Society
    </p>

</header>


<main class="container">


    <!-- LOGIN SECTION -->

    <section class="card" id="loginSection">

        <h2>
            Attendance Officer Access
        </h2>

        <p>
            Sign in using your authorized VSU Google account
            to access the attendance scanner.
        </p>

        <div id="googleButton"></div>

    </section>



    <!-- SCANNER SECTION -->

    <section class="card scanner-section" id="scannerSection">

        <h2>
            Attendance Scanner
        </h2>

        <p id="welcomeMessage">
            Welcome, Officer!
        </p>


        <div class="scanner-box">

            <div id="reader"></div>

        </div>


        <p id="scanMessage">
            Point the camera at a student's QR code.
        </p>


        <button
            class="logout-button"
            onclick="logout()">

            Sign Out

        </button>

    </section>


</main>


<footer>

    Young Economists' Society

</footer>



<script>


/* =========================================================
   SETTINGS
   ========================================================= */


const CLIENT_ID =
    "69872284642-ssg31lkf3b6tkuskslf1facd36fbutuj.apps.googleusercontent.com";


const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbzpj5BrUy0tlF7ODwGJCf4LXG5JkRXXbt25vhNz7bS9jHg9eVV5NOeuAfwRk9Oo3Y0-/exec";


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */


let googleIdToken = null;


function handleCredentialResponse(response) {

    console.log("Google sign-in successful.");

    googleIdToken = response.credential;


    /*
     * Decode the token only for displaying
     * the officer's name and email.
     */

    try {

        const parts =
            googleIdToken.split(".");

        const payload =
            JSON.parse(
                atob(
                    parts[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/")
                )
            );


        const name =
            payload.name || "Officer";


        const email =
            payload.email || "";


        document.getElementById("loginSection")
            .style.display = "none";


        document.getElementById("scannerSection")
            .style.display = "block";


        document.getElementById("welcomeMessage")
            .innerText =
                "Signed in as: " +
                name +
                " (" +
                email +
                ")";


        console.log("Signed-in email:", email);


        startScanner();

    }

    catch (error) {

        console.error(
            "Could not read Google credential:",
            error
        );

        alert(
            "There was a problem reading your Google sign-in."
        );

    }

}



/* =========================================================
   QR SCANNER
   ========================================================= */


let qrScanner = null;


function startScanner() {

    console.log("Starting QR scanner...");


    if (qrScanner !== null) {

        try {

            qrScanner.clear();

        }

        catch (error) {

            console.log(
                "Previous scanner already cleared."
            );

        }

    }


    qrScanner =
        new Html5Qrcode("reader");


    qrScanner.start(

        {
            facingMode: "environment"
        },


        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },


        function(decodedText) {


            console.log(
                "FULL QR:",
                decodedText
            );


            /*
             * IMPORTANT:
             *
             * We know your QR contains a
             * Google Apps Script URL.
             *
             * For now, we are NOT sending
             * anything to the backend.
             *
             * We are only showing the URL
             * and the value at its end.
             */


            const cleanQR =
                decodedText.trim();


            const pieces =
                cleanQR.split("/");


            const extractedID =
                pieces[pieces.length - 1];


            console.log(
                "EXTRACTED ID:",
                extractedID
            );


            document.getElementById("scanMessage")
                .innerText =

                    "QR detected!\n\n" +

                    "Full QR:\n" +

                    cleanQR +

                    "\n\n" +

                    "Extracted ID:\n" +

                    extractedID;


            /*
             * Stop the scanner so it doesn't
             * scan the same QR repeatedly.
             */

            qrScanner.stop()

                .then(function() {

                    console.log(
                        "Scanner stopped."
                    );

                })

                .catch(function(error) {

                    console.error(
                        "Could not stop scanner:",
                        error
                    );

                });

        },


        function(errorMessage) {

            /*
             * Normal QR scanning errors
             * are ignored.
             */

        }

    )

    .catch(function(error) {

        console.error(
            "Camera error:",
            error
        );


        document.getElementById("scanMessage")
            .innerText =

                "Unable to access the camera.\n\n" +

                "Please allow camera access.";

    });

}



/* =========================================================
   LOGOUT
   ========================================================= */


function logout() {


    if (qrScanner !== null) {

        qrScanner.stop()

            .then(function() {

                console.log(
                    "Scanner stopped."
                );

            })

            .catch(function(error) {

                console.log(
                    "Scanner was not running."
                );

            });

    }


    googleIdToken = null;


    document.getElementById("scannerSection")
        .style.display = "none";


    document.getElementById("loginSection")
        .style.display = "block";


    document.getElementById("googleButton")
        .innerHTML = "";


    google.accounts.id.disableAutoSelect();


    renderGoogleButton();

}



/* =========================================================
   GOOGLE BUTTON
   ========================================================= */


function renderGoogleButton() {


    const button =
        document.getElementById(
            "googleButton"
        );


    if (!button) {

        console.error(
            "googleButton element not found."
        );

        return;

    }


    button.innerHTML = "";


    google.accounts.id.renderButton(

        button,

        {

            theme: "outline",

            size: "large",

            text: "signin_with",

            shape: "rectangular",

            width: 280

        }

    );

}



/* =========================================================
   PAGE INITIALIZATION
   ========================================================= */


window.onload = function() {


    console.log(
        "YES Attendance Scanner loaded."
    );


    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.id
    ) {

        console.error(
            "Google Identity Services did not load."
        );

        return;

    }


    google.accounts.id.initialize({

        client_id: CLIENT_ID,

        callback:
            handleCredentialResponse

    });


    renderGoogleButton();

};


</script>

</body>

</html>
