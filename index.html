<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YES Attendance Scanner</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

.header {
    background: #0b4f9c;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 8px 0 0;
    font-size: 15px;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 35px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    text-align: center;
}

.card h2 {
    margin-bottom: 10px;
}

.card p {
    color: #6b7280;
    line-height: 1.5;
}

#googleButton {
    display: flex;
    justify-content: center;
    margin-top: 25px;
}

.scanner-section {
    display: none;
}

#reader {
    width: 100%;
    max-width: 450px;
    margin: 25px auto;
}

.scanner-box {
    margin: 25px auto;
    padding: 15px;
    border: 2px dashed #0b4f9c;
    border-radius: 12px;
}

#scanMessage {
    white-space: pre-wrap;
    word-break: break-word;
}

.logout-button {
    background: #dc2626;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 20px;
}

footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    padding: 20px;
}

</style>

</head>

<body>


<header class="header">

    <h1>YES Attendance Scanner</h1>

    <p>
        Young Economists' Society
    </p>

</header>


<main class="container">


<!-- LOGIN SECTION -->

<section class="card" id="loginSection">

    <h2>
        Attendance Officer Access
    </h2>

    <p>
        Sign in using your authorized VSU Google account
        to access the attendance scanner.
    </p>

    <div id="googleButton"></div>

</section>



<!-- SCANNER SECTION -->

<section class="card scanner-section" id="scannerSection">

    <h2>
        Attendance Scanner
    </h2>

    <p id="welcomeMessage">
        Welcome, Officer!
    </p>


    <div class="scanner-box">

        <div id="reader"></div>

    </div>


    <p id="scanMessage">
        Point the camera at a student's QR code.
    </p>


    <button
        class="logout-button"
        onclick="logout()">

        Sign Out

    </button>

</section>


</main>


<footer>

    Young Economists' Society

</footer>



<script>


/* =========================================================
   SETTINGS
========================================================= */

const CLIENT_ID =
"69872284642-ssg31lkf3b6tkuskslf1facd36fbutuj.apps.googleusercontent.com";


const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbzpj5BrUy0tlF7ODwGJCf4LXG5JkRXXbt25vhNz7bS9jHg9eVV5NOeuAfwRk9Oo3Y0-/exec";


let googleIdToken = null;

let qrScanner = null;


/* =========================================================
   GOOGLE SIGN-IN
========================================================= */

function handleCredentialResponse(response) {

    console.log("Google sign-in successful.");

    googleIdToken = response.credential;


    try {

        const parts =
            googleIdToken.split(".");


        const payload =
            JSON.parse(
                atob(
                    parts[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/")
                )
            );


        const name =
            payload.name || "Officer";


        const email =
            payload.email || "";


        document.getElementById("loginSection")
            .style.display = "none";


        document.getElementById("scannerSection")
            .style.display = "block";


        document.getElementById("welcomeMessage")
            .innerText =
                "Signed in as: " +
                name +
                " (" +
                email +
                ")";


        console.log(
            "Signed-in email:",
            email
        );


        startScanner();

    }

    catch (error) {

        console.error(
            "Google credential error:",
            error
        );

        alert(
            "There was a problem reading your Google sign-in."
        );

    }

}



/* =========================================================
   QR SCANNER
========================================================= */

function startScanner() {

    console.log(
        "Starting QR scanner..."
    );


    qrScanner =
        new Html5Qrcode("reader");


    qrScanner.start(

        {
            facingMode: "environment"
        },

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },


        function(decodedText) {


            console.log(
                "FULL QR:",
                decodedText
            );


            const cleanQR =
                decodedText.trim();


            let extractedID;


            try {

                const url =
                    new URL(cleanQR);


                extractedID =
                    url.searchParams.get("id");

            }

            catch (error) {

                console.error(
                    "QR is not a valid URL:",
                    error
                );


                document.getElementById(
                    "scanMessage"
                ).innerText =
                    "Invalid QR code.";


                return;

            }


            if (!extractedID) {

                document.getElementById(
                    "scanMessage"
                ).innerText =
                    "Student ID could not be found in QR code.";


                return;

            }


            console.log(
                "EXTRACTED STUDENT ID:",
                extractedID
            );


            document.getElementById(
                "scanMessage"
            ).innerText =
                "QR detected.\n\n" +
                "Student ID: " +
                extractedID +
                "\n\n" +
                "Checking attendance...";


            qrScanner.stop()

                .then(function() {

                    console.log(
                        "Scanner stopped."
                    );


                    sendAttendance(
                        extractedID
                    );

                })

                .catch(function(error) {

                    console.error(
                        "Could not stop scanner:",
                        error
                    );


                    sendAttendance(
                        extractedID
                    );

                });

        },


        function(errorMessage) {

            // Normal scanning errors are ignored.

        }

    )

    .catch(function(error) {

        console.error(
            "Camera error:",
            error
        );


        document.getElementById(
            "scanMessage"
        ).innerText =
            "Unable to access the camera.\n\n" +
            "Please allow camera access.";

    });

}



/* =========================================================
   SEND ATTENDANCE TO APPS SCRIPT
========================================================= */

function sendAttendance(studentId) {


    if (!googleIdToken) {

        document.getElementById(
            "scanMessage"
        ).innerText =
            "Please sign in again.";

        return;

    }


    fetch(

        BACKEND_URL,

        {

            method: "POST",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

                studentId:
                    studentId.trim(),

                idToken:
                    googleIdToken

            })

        }

    )


    .then(function(response) {

        return response.json();

    })


    .then(function(result) {

        console.log(
            "Backend response:",
            result
        );


        if (result.success) {


            document.getElementById(
                "scanMessage"
            ).innerText =

                "✓ Attendance recorded!\n\n" +

                result.student.name +
                "\n" +

                result.student.id +
                "\n" +

                result.date +
                " " +

                result.time;


        }

        else {


            document.getElementById(
                "scanMessage"
            ).innerText =

                "⚠ " +
                result.message;

        }


        setTimeout(function() {

            startScanner();

        }, 2500);


    })


    .catch(function(error) {

        console.error(
            "Backend error:",
            error
        );


        document.getElementById(
            "scanMessage"
        ).innerText =
            "Unable to connect to the attendance server.";


        setTimeout(function() {

            startScanner();

        }, 2500);

    });

}



/* =========================================================
   GOOGLE BUTTON
========================================================= */

function renderGoogleButton() {


    const button =
        document.getElementById(
            "googleButton"
        );


    if (!button) {

        console.error(
            "Google button container not found."
        );

        return;

    }


    button.innerHTML = "";


    google.accounts.id.renderButton(

        button,

        {

            theme: "outline",

            size: "large",

            text: "signin_with",

            shape: "rectangular",

            width: 280

        }

    );

}



/* =========================================================
   INITIALIZE PAGE
========================================================= */

window.onload = function() {


    console.log(
        "YES Attendance Scanner loaded."
    );


    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.id
    ) {

        console.error(
            "Google Identity Services did not load."
        );

        return;

    }


    google.accounts.id.initialize({

        client_id:
            CLIENT_ID,

        callback:
            handleCredentialResponse

    });


    renderGoogleButton();

};



/* =========================================================
   LOGOUT
========================================================= */

function logout() {


    if (qrScanner) {

        qrScanner.stop()

            .catch(function() {

                // Scanner already stopped.

            });

    }


    googleIdToken = null;


    document.getElementById(
        "scannerSection"
    ).style.display = "none";


    document.getElementById(
        "loginSection"
    ).style.display = "block";


    google.accounts.id.disableAutoSelect();


    renderGoogleButton();

}


</script>

</body>
</html>
